apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aegis-spoke.fullname" . }}-status-reader
  labels:
    {{- include "aegis-spoke.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aegis-spoke.fullname" . }}-status-reader
  labels:
    {{- include "aegis-spoke.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aegis-spoke.fullname" . }}-status-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "aegis-spoke.serviceAccountName" . }}
    namespace: {{ include "aegis-spoke.namespace" . }}
