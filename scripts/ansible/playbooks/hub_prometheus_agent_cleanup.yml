---
- name: Remove legacy Hub Prometheus Agent
  hosts: hub_eks
  gather_facts: false

  tasks:
    - name: Check required local commands
      ansible.builtin.shell: "command -v {{ item }}"
      args:
        executable: /bin/bash
      changed_when: false
      loop:
        - aws
        - kubectl

    - name: Update kubeconfig for Hub EKS
      ansible.builtin.command:
        cmd: "{{ update_kubeconfig_command }}"
      changed_when: true

    - name: Delete legacy namespaced Prometheus Agent resources
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ grafana_namespace }}
          delete deployment/prometheus-agent service/prometheus-agent
          configmap/prometheus-agent-config serviceaccount/prometheus-agent
          --ignore-not-found=true
      register: prometheus_agent_namespaced_cleanup
      changed_when: "'deleted' in prometheus_agent_namespaced_cleanup.stdout"

    - name: Delete legacy Prometheus Agent cluster resources
      ansible.builtin.command:
        cmd: >-
          kubectl delete clusterrole/prometheus-agent
          clusterrolebinding/prometheus-agent
          --ignore-not-found=true
      register: prometheus_agent_cluster_cleanup
      changed_when: "'deleted' in prometheus_agent_cluster_cleanup.stdout"

    - name: Print cleanup summary
      ansible.builtin.debug:
        msg:
          - "{{ prometheus_agent_namespaced_cleanup.stdout | default('') }}"
          - "{{ prometheus_agent_cluster_cleanup.stdout | default('') }}"
