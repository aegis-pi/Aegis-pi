name: Build and Push Edge Images

on:
  push:
    branches:
      - main
    paths:
      - apps/edge-agent/**
      - apps/factory-a-log-adapter/**
      - apps/edge-iot-publisher/**
      - apps/snapshot-uploader/**
      - .github/workflows/build-push.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::611058323802:role/AEGIS-GitHubActions-ECRPush

jobs:
  build-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: edge-agent
            context: apps/edge-agent
            dockerfile: apps/edge-agent/Dockerfile
            repository: aegis/edge-agent
          - name: factory-a-log-adapter
            context: apps/factory-a-log-adapter
            dockerfile: apps/factory-a-log-adapter/Dockerfile
            repository: aegis/factory-a-log-adapter
          - name: edge-iot-publisher
            context: apps/edge-iot-publisher
            dockerfile: apps/edge-iot-publisher/Dockerfile
            repository: aegis/edge-iot-publisher
          - name: snapshot-uploader
            context: apps/snapshot-uploader
            dockerfile: apps/snapshot-uploader/Dockerfile
            repository: aegis/snapshot-uploader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: image
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          registry="${{ steps.login-ecr.outputs.registry }}"
          echo "sha_tag=sha-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image=${registry}/${{ matrix.repository }}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.image }}:main
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Print pushed image
        run: |
          echo "Pushed ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}"
